name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
          
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          # cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: pnpm install

      - name: setup python (for pyo3 build script)
        if: hashFiles('crates/arspe-py/Cargo.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 构建 arspe_py 扩展并放入 bundle 资源目录（tauri.conf.json 的 resources
      # 路径相对 src-tauri/ 解析，故资源暂存目录为 src-tauri/resources/py-interface）。
      # crates/arspe-py 尚未合入 release 时 hashFiles 为空，本步骤自动跳过（本地构建仅含占位 README）。
      - name: build python extension (arspe_py)
        if: hashFiles('crates/arspe-py/Cargo.toml') != ''
        shell: bash
        run: |
          cargo build --release -p arspe-py
          mkdir -p src-tauri/resources/py-interface
          case "${{ matrix.platform }}" in
            windows*) cp target/release/arspe_py.dll src-tauri/resources/py-interface/arspe_py.pyd ;;
            macos*)   cp target/release/arspe_py.dylib src-tauri/resources/py-interface/arspe_py.so ;;
          esac
          cp crates/arspe-py/arspe_py.pyi src-tauri/resources/py-interface/

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'ARSpeViewer v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

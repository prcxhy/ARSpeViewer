[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "arspe-py"
version = "1.2.0"
description = "Python bindings for ARSpeViewer core (spectral data extraction & axis conversion)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
license = "GPL-3.0"

[tool.maturin]
features = ["pyo3/extension-module"]
include = [{ path = "arspe_py.pyi", format = ["sdist", "wheel"] }]
